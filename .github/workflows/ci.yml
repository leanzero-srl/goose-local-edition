name: CI

# RUNS ON THE SELF-HOSTED WORKHORSE RUNNER (Mac Studio, label `goose`), like LeanZero's Forge apps.
# Runner: ~/actions-runner-goose on the workhorse, a launchd agent started at nice 10 so a CI
# compile always yields to a swarm/benchmark run on the same box. Re-register with
# `gh api -X POST repos/leanzero-srl/goose-local-edition/actions/runners/registration-token`.
#
# THIS REPO IS PUBLIC, so a self-hosted job must never run code from someone else's fork. A pull
# request runs the workflow file from ITS OWN branch, so a guard in this file cannot hold one back:
# the triggers are push (main) and workflow_dispatch ONLY, every workhorse job carries the repository
# guard, checkout keeps no credentials on the persistent machine, and the repo requires approval for
# every outside contributor's workflow run (a fork PR that adds its own workflow waits for a person).
# Only the Windows build stays on a GitHub-hosted runner (it cannot run on a Mac; hosted minutes are
# free on a public repo). Same standard as Sentinel Vault (leanzero-forge-app-baseline ci-pipeline.md).
#
# macOS, not Ubuntu: no apt/gnome-keyring. Tests run with GOOSE_DISABLE_KEYRING=1 and a throwaway
# HOME so they never touch the workhorse's keychain or the Goose app's real config and sessions.
# No rust-cache: the runner is a persistent machine, so each job keeps its own target dir under
# ~/ci-tools/goose-target (wiped past 60 GB — cargo never garbage-collects target/).
#
# UPSTREAM INGEST: keep THIS file over block/goose's ci.yml when merging upstream.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  rust-format:
    name: Check Rust Code Format
    runs-on: [self-hosted, goose]
    if: github.repository == 'leanzero-srl/goose-local-edition'
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Workhorse environment
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run cargo fmt
        run: cargo fmt --check

  rust-build-and-test:
    name: Build and Test Rust Project
    runs-on: [self-hosted, goose]
    if: github.repository == 'leanzero-srl/goose-local-edition'
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Workhorse environment
        run: ./.github/workhorse-env.sh "${{ github.job }}"

      - name: Build and Test
        run: |
          export HOME="$ISOLATED_HOME"
          # launchd starts the runner at macOS's 256 open files (ubuntu-latest: 65536); the
          # leanzero-link proxy/manager tests open more than that and fail with EMFILE.
          ulimit -n 65536
          export CARGO_INCREMENTAL=0
          cargo test -- --skip scenario_tests::scenarios::tests
          cargo test --jobs 1 scenario_tests::scenarios::tests
        working-directory: crates
        env:
          RUST_MIN_STACK: 8388608

  rust-build-windows:
    name: Build Rust Project on Windows
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: windows-ci

      - name: Setup Rust
        shell: bash
        run: |
          rustup show
          rustup target add x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --target x86_64-pc-windows-msvc
        env:
          CARGO_INCREMENTAL: "0"

  rust-msrv:
    name: Check MSRV
    runs-on: [self-hosted, goose]
    if: github.repository == 'leanzero-srl/goose-local-edition'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ -z "$msrv" ]; then
            echo "Could not find rust-version in workspace Cargo.toml" >&2
            exit 1
          fi
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
          echo "MSRV: $msrv"

      - name: Workhorse environment
        run: ./.github/workhorse-env.sh "${{ github.job }}"

      - name: Install the MSRV toolchain
        run: rustup toolchain install "${{ steps.msrv.outputs.msrv }}" --profile minimal

      - name: Check with MSRV toolchain
        run: cargo +${{ steps.msrv.outputs.msrv }} check --workspace --locked --all-targets
        env:
          CARGO_INCREMENTAL: "0"

  rust-lint:
    name: Lint Rust Code
    runs-on: [self-hosted, goose]
    if: github.repository == 'leanzero-srl/goose-local-edition'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Workhorse environment
        run: ./.github/workhorse-env.sh "${{ github.job }}"

      - name: Lint
        run: |
          export CARGO_INCREMENTAL=0
          cargo clippy --workspace --all-targets --exclude v8 -- -D warnings

  schema-check:
    name: Check Generated Schemas are Up-to-Date
    runs-on: [self-hosted, goose]
    if: github.repository == 'leanzero-srl/goose-local-edition'
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Workhorse environment
        run: ./.github/workhorse-env.sh "${{ github.job }}"

      - name: Install Node.js Dependencies
        run: |
          source ./bin/activate-hermit
          cd ui/desktop && pnpm install --frozen-lockfile
          cd ../sdk && pnpm install --frozen-lockfile

      - name: Check ACP Schema is Up-to-Date
        run: |
          source ./bin/activate-hermit
          just check-acp-schema

      - name: Test ACP Client SDK
        run: |
          source ./bin/activate-hermit
          cd ui/sdk
          pnpm test
          pnpm run typecheck:test

  desktop-lint:
    name: Test and Lint Electron Desktop App
    runs-on: [self-hosted, goose]
    if: github.repository == 'leanzero-srl/goose-local-edition'
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install Dependencies
        run: source ../../bin/activate-hermit && pnpm install --frozen-lockfile
        working-directory: ui/desktop

      - name: Run Lint
        run: source ../../bin/activate-hermit && pnpm run lint:check
        working-directory: ui/desktop

      - name: Run Tests
        run: source ../../bin/activate-hermit && pnpm run test:run
        working-directory: ui/desktop
