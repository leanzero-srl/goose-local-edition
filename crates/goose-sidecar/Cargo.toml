[package]
name = "goose-sidecar"
version = "0.1.0"
edition = "2021"
description = "Supervisor for local inference engine sidecars (spawn, health, restart, memory gate)"

[dependencies]
anyhow = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "time", "sync", "macros", "rt-multi-thread", "io-util"] }
tracing = { workspace = true }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
