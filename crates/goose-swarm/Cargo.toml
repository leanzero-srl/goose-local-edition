[package]
name = "goose-swarm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Weighted work-queue swarm scheduler for goose-local-edition (LM Studio / LM Link): DAG locking queue, per-device weights, work-stealing, shared context. Model-agnostic via the TaskDispatcher trait."

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
fs2.workspace = true
libc = "0.2.182"
rand.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
sha2.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
