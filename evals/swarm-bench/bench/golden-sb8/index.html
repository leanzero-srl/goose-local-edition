<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gantry control</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f8fafc;font:14px system-ui}header{padding:18px 24px;display:flex;align-items:center;gap:20px;border-bottom:1px solid #475569}h1{font-size:22px;margin:0}main{display:grid;grid-template-columns:1fr 290px;height:calc(100vh - 70px)}aside{padding:18px;background:#1e293b;overflow:auto}#viewport{position:relative;min-width:600px;min-height:400px}canvas{display:block;width:100%;height:100%}button{background:#334155;color:white;border:1px solid #64748b;border-radius:5px;padding:8px 12px;cursor:pointer}button:hover{background:#475569}button:active{transform:translateY(1px)}button:disabled{opacity:.5;cursor:wait}input{width:85px;background:#0f172a;color:white;border:1px solid #64748b;padding:7px}label{display:flex;justify-content:space-between;margin:8px 0}table{width:100%;border-collapse:collapse;margin-top:16px}td{padding:8px 4px;border-bottom:1px solid #475569}tr{cursor:pointer}tr[aria-selected=true]{background:#1d4ed8}#message{min-height:40px;margin-top:12px}#selection{min-height:50px;font-family:monospace}.cameras{position:absolute;top:12px;left:12px;display:flex;gap:6px}#revision{margin-left:auto;color:#38bdf8}
</style><header><h1>GANTRY / CONTROL</h1><span>Warehouse digital twin</span><span id="revision" data-testid="revision">0</span></header><main><div id="viewport"><canvas data-testid="scene"></canvas><div class="cameras"><button data-testid="camera-iso">ISO</button><button data-testid="camera-front">FRONT</button><button data-testid="camera-top">TOP</button></div></div><aside><h2>Move crane</h2><form id="controls"><label>X<input aria-label="X" type="number" step="any" name="x"></label><label>Z<input aria-label="Z" type="number" step="any" name="z"></label><label>Height<input aria-label="Height" type="number" step="any" name="y"></label><label>Yaw<input aria-label="Yaw" type="number" step="any" name="yaw"></label><button>Move</button></form><p><button id="grip">Grip</button> <button id="release">Release</button></p><div role="status" id="message"></div><button id="retry" hidden>Retry</button><h2>Cargo</h2><div data-testid="selection" id="selection">Select a box</div><table><tbody id="cargo"></tbody></table></aside></main>
<script type="module">
import * as T from '/three.js';
const canvas=document.querySelector('canvas'),viewport=document.querySelector('#viewport'), form=document.querySelector('form');
const renderer=new T.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;
const world=new T.Scene();world.background=new T.Color('#0b1120');let sc,st,selected=null,mode='iso',camera,group=new T.Group(),pick=[],busy=false;world.add(group);
const colors={frame:'#475569',beam:'#f59e0b',trolley:'#06b6d4',spreader:'#ef4444',cable:'#e2e8f0',wheel:'#111827'};
function mesh(w,h,d,x,y,z,color,edge=false){const o=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshBasicMaterial({color}));o.position.set(x,y,z);group.add(o);if(edge){let e=new T.LineSegments(new T.EdgesGeometry(o.geometry),new T.LineBasicMaterial({color:'#020617'}));o.add(e);}return o;}
function rod(a,b,r,color){let delta=new T.Vector3().subVectors(b,a);let o=new T.Mesh(new T.CylinderGeometry(r,r,delta.length(),8),new T.MeshBasicMaterial({color}));o.position.copy(a).add(b).multiplyScalar(.5);o.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),delta.normalize());group.add(o);return o;}
function draw(){if(!st)return;group.traverse(o=>{o.geometry?.dispose();if(o.material)o.material.dispose()});world.remove(group);group=new T.Group();world.add(group);pick=[];
mesh(sc.width,.1,sc.depth,sc.width/2,-.06,sc.depth/2,'#0f172a');
for(let x of [0,sc.width]){for(let z of [0,sc.depth]){mesh(.2,sc.height,.2,x,sc.height/2,z,colors.frame);rod(new T.Vector3(x,sc.height-1,z),new T.Vector3(x+(x===0?1:-1),sc.height,z),.06,colors.frame)}mesh(.2,.2,sc.depth,x,sc.height,sc.depth/2,colors.frame)}
for(let z of [st.pose.z-.25,st.pose.z+.25])mesh(sc.width,.15,.15,sc.width/2,sc.height,z,colors.beam);
mesh(1,.3,.8,st.pose.x,sc.height+.2,st.pose.z,colors.trolley);
for(let dx of [-.6,.6])for(let dz of [-.5,.5]){let wheel=new T.Mesh(new T.CylinderGeometry(.12,.12,.12,16),new T.MeshBasicMaterial({color:colors.wheel}));wheel.rotation.x=Math.PI/2;wheel.position.set(st.pose.x+dx,sc.height+.05,st.pose.z+dz);group.add(wheel)}
const load=st.boxes.find(b=>b.id===st.held), sy=st.pose.y+(load?.h??0)+.3;
mesh(1,.15,.8,st.pose.x,sy,st.pose.z,colors.spreader);
for(let dx of [-.4,.4])for(let dz of [-.3,.3])rod(new T.Vector3(st.pose.x+dx,sy,st.pose.z+dz),new T.Vector3(st.pose.x+dx,sc.height+.2,st.pose.z+dz),.025,colors.cable);
for(let b of [...sc.obstacles,...st.boxes]){let m=mesh(b.w,b.h,b.d,b.x,b.y+b.h/2,b.z,b.color??'#64748b',true);m.rotation.y=T.MathUtils.degToRad(b.yaw??0);if(b.color){m.userData.id=b.id;pick.push(m);if(selected===b.id){let outline=new T.BoxHelper(m,'#ffffff');group.add(outline)}}}
renderer.render(world,camera);document.querySelector('#revision').textContent=String(st.revision);
const tbody=document.querySelector('#cargo');tbody.replaceChildren();for(let b of st.boxes){let row=document.createElement('tr');row.dataset.testid='box-'+b.id;row.setAttribute('aria-selected',String(selected===b.id));for(let text of [b.id,b.mass+' kg']){let td=document.createElement('td');td.textContent=text;row.append(td)}row.onclick=()=>select(b.id);tbody.append(row)}
if(selected){let b=st.boxes.find(b=>b.id===selected);document.querySelector('#selection').textContent=`${b.id} / ${b.w}×${b.h}×${b.d} m / ${b.mass} kg`}}
function view(){if(!sc)return;const width=viewport.clientWidth,height=viewport.clientHeight,aspect=width/height;renderer.setSize(width,height,false);let span=mode==='front'?Math.max(sc.height+4,(sc.width+4)/aspect):mode==='top'?Math.max(sc.depth+4,(sc.width+4)/aspect):1.6*Math.max(sc.width,sc.depth,sc.height);camera=new T.OrthographicCamera(-span*aspect/2,span*aspect/2,span/2,-span/2,.1,200);let target=new T.Vector3(sc.width/2,sc.height/2,sc.depth/2);if(mode==='front')camera.position.set(sc.width/2,sc.height/2,sc.depth+20);else if(mode==='top'){camera.position.set(sc.width/2,sc.height+20,sc.depth/2);target.y=0;camera.up.set(0,0,-1)}else camera.position.copy(target).add(new T.Vector3(20,20,24));camera.lookAt(target);draw()}
function select(id){selected=id;draw()}
for(let name of ['front','top','iso'])document.querySelector(`[data-testid=camera-${name}]`).onclick=()=>{mode=name;view()};new ResizeObserver(view).observe(viewport);
const ray=new T.Raycaster();let drag;
canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,pos:camera.position.clone()};};canvas.onpointerup=e=>{if(drag&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<4){const r=canvas.getBoundingClientRect();ray.setFromCamera(new T.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),camera);const hit=ray.intersectObjects(pick)[0];if(hit)select(hit.object.userData.id)}drag=null};canvas.onpointermove=e=>{if(drag&&e.buttons){let target=new T.Vector3(sc.width/2,sc.height/2,sc.depth/2);let offset=drag.pos.clone().sub(target);offset.applyAxisAngle(new T.Vector3(0,1,0),(e.clientX-drag.x)*.008);camera.position.copy(target).add(offset);camera.lookAt(target);renderer.render(world,camera)}};canvas.onwheel=e=>{e.preventDefault();camera.zoom=Math.max(.3,Math.min(4,camera.zoom*(e.deltaY>0?.9:1.1)));camera.updateProjectionMatrix();renderer.render(world,camera)};
async function refresh(){try{let response=await fetch('/api/state');if(!response.ok)throw Error('Could not refresh state');let next=await response.json();if(!st||next.revision!==st.revision){st=next;draw()}document.querySelector('#retry').hidden=true}catch(e){message(e.message,true);document.querySelector('#retry').hidden=false}}
function message(text,error=false){let m=document.querySelector('#message');m.setAttribute('role',error?'alert':'status');m.textContent=text}
async function command(op,values={}){if(busy)return;busy=true;document.querySelectorAll('aside button').forEach(b=>b.disabled=true);message('Working…');try{const response=await fetch('/api/commands',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:crypto.randomUUID(),revision:st.revision,op,...values})});const result=await response.json();if(!response.ok)throw Error(result.error);st=result;draw();message('Command applied')}catch(e){message(e.message,true);await refresh()}finally{busy=false;document.querySelectorAll('aside button').forEach(b=>b.disabled=false)}}
form.onsubmit=e=>{e.preventDefault();command('move',Object.fromEntries([...new FormData(form)].map(([k,v])=>[k,Number(v)])))};document.querySelector('#grip').onclick=()=>command('grip',{boxId:selected??''});document.querySelector('#release').onclick=()=>command('release');document.querySelector('#retry').onclick=refresh;
try{let response=await fetch('/api/scene');if(!response.ok)throw Error('Scene unavailable');sc=await response.json();st=await(await fetch('/api/state')).json();for(let k of ['x','z','y','yaw'])form.elements[k].value=st.pose[k];view();setInterval(refresh,750)}catch(e){message(e.message,true);document.querySelector('#retry').hidden=false}
</script></html>
