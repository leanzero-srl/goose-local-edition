modules:
  trigger:
    - key: scope-issue-updated
      function: on-issue-updated
      events:
        - avi:jira:updated:issue
    - key: scope-issue-deleted
      function: on-issue-deleted
      events:
        - avi:jira:deleted:issue
    - key: scope-app-upgraded
      function: on-app-upgraded
      events:
        - avi:forge:upgraded:app
  consumer:
    - key: scope-ledger-consumer
      queue: scope-ledger
      function: consume-change
  scheduledTrigger:
    - key: scope-reconcile
      function: reconcile
      interval: hour
  dashboards:widget:
    - key: scope-widget
      title: Sprint scope creep
      description: Committed, added and removed story points and scope creep for the active sprints of one scrum board.
      thumbnail: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      resource: widget
      resolver:
        function: ui-resolver
      edit:
        resource: widget-edit
  jira:sprintAction:
    - key: scope-sprint-ledger
      title: Scope ledger
      actionType: modal
      viewportSize: large
      resource: sprint
      resolver:
        function: ui-resolver
  action:
    - key: get-sprint-scope
      name: Get sprint scope
      function: rovo-get-sprint-scope
      actionVerb: GET
      description: Returns the scope ledger of one Jira sprint for the asking person - committed, added and removed story points, scope creep, and the sprint changes they can see.
      inputs:
        sprintId:
          title: Sprint ID
          type: string
          required: true
          description: The numeric id of the Jira Software sprint, for example 41.
  rovo:skill:
    - key: sprint-scope-analyst
      source:
        dir: skills/sprint-scope-analyst
      dependencies:
        tools:
          - get-sprint-scope
  rovo:agent:
    - key: scope-ledger-agent
      name: Scope Ledger
      description: Explains what entered or left a sprint after it started, who changed it and what it did to the sprint's scope.
      prompt: >
        You help agile coaches and teams understand sprint scope creep. When someone asks what changed in a
        sprint after it started, how much scope was added or removed, or who changed it, use the
        sprint-scope-analyst skill. Report numbers exactly as the action returns them and never invent changes.
      skills:
        - sprint-scope-analyst
      actions:
        - get-sprint-scope
      conversationStarters:
        - What entered sprint 41 after it started?
        - How much scope creep does my sprint have?
  rovo:mcp:
    - key: scope-ledger-mcp
      name: Scope Ledger
      tools:
        - get-sprint-scope
  jira:adminPage:
    - key: scope-admin
      title: Scope Ledger
      resource: admin
      render: native
      resolver:
        function: admin-resolver
  jira:customField:
    - key: scope-status
      name: Scope status
      description: Where the issue stands in its active sprint's scope - committed, added +points, or removed. Written by Scope Ledger.
      type: string
      readOnly: true
  webtrigger:
    - key: ci-deploy
      function: on-ci-deploy
      response:
        type: static
        outputs:
          - key: accepted
            statusCode: 202
            contentType: application/json
            body: '{"status":"accepted"}'
          - key: duplicate
            statusCode: 200
            contentType: application/json
            body: '{"status":"duplicate"}'
          - key: unauthorized
            statusCode: 401
            contentType: application/json
            body: '{"error":"invalid signature"}'
          - key: invalid
            statusCode: 400
            contentType: application/json
            body: '{"error":"invalid event"}'
  llm:
    - key: scope-ledger-llm
      model:
        - claude
  function:
    - key: on-issue-updated
      handler: index.onIssueUpdated
    - key: on-issue-deleted
      handler: index.onIssueDeleted
    - key: on-app-upgraded
      handler: index.onAppUpgraded
    - key: consume-change
      handler: index.consumeChange
      timeoutSeconds: 900
    - key: reconcile
      handler: index.reconcile
      timeoutSeconds: 900
    - key: ui-resolver
      handler: index.uiResolver
    - key: admin-resolver
      handler: index.adminResolver
    - key: on-ci-deploy
      handler: index.ciDeploy
    - key: rovo-get-sprint-scope
      handler: index.getSprintScope
resources:
  - key: widget
    path: static/widget/build
  - key: widget-edit
    path: static/widget-edit/build
  - key: sprint
    path: static/sprint/build
  - key: admin
    path: src/frontend/admin.jsx
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
    - read:board-scope:jira-software
    - read:board-scope.admin:jira-software
    - read:sprint:jira-software
    - read:project:jira
    - read:jira-user
app:
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
  runtime:
    name: nodejs22.x
  storage:
    entities:
      - name: scope-ledger
        attributes:
          sprintId:
            type: string
          at:
            type: float
          changeId:
            type: string
          kind:
            type: string
          issueId:
            type: string
          issueKey:
            type: string
          estimate:
            type: float
          boardId:
            type: string
          estimateField:
            type: string
          deleted:
            type: boolean
          deployedEnvs:
            type: string
          authorId:
            type: string
          authorName:
            type: string
          source:
            type: string
        indexes:
          - name: by-sprint
            partition:
              - sprintId
            range:
              - at
          - name: by-issue
            partition:
              - issueId
            range:
              - at
      - name: scope-change
        attributes:
          sprintId:
            type: string
          changeId:
            type: string
          at:
            type: float
          created:
            type: string
          issueId:
            type: string
          issueKey:
            type: string
          kind:
            type: string
          authorId:
            type: string
          authorName:
            type: string
          source:
            type: string
        indexes:
          - name: by-sprint
            partition:
              - sprintId
            range:
              - at
      - name: sprint-issue
        attributes:
          sprintId:
            type: string
          issueId:
            type: string
          issueKey:
            type: string
          inSprint:
            type: boolean
          estimate:
            type: float
          deleted:
            type: boolean
        indexes:
          - name: by-sprint
            partition:
              - sprintId
            range:
              - issueId
          - name: by-issue
            partition:
              - issueId
            range:
              - sprintId
